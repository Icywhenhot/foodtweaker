
# Done to increase the memory available to Gradle.
# preferIPv4Stack avoids "Unable to establish loopback connection" on hosts where IPv6 (::1) loopback is unavailable.
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true

# Mod properties
mod_version = 1.0.0
maven_group = com.foodtweaker
archives_name = foodtweaker
enabled_platforms = fabric,forge

# Minecraft properties
minecraft_version = 1.20.1

# Dependencies
architectury_api_version = 9.2.14
fabric_loader_version = 0.19.2
fabric_api_version = 0.92.9+1.20.1
forge_version = 1.20.1-47.4.10
